<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="box">
        <h1>Cadastro de usuário</h1>
        <p>Preencha os dados abaixo:</p>
        <form action="cadastro.php" method="post">

            <fieldset>
                <label for="nome">Nome Completo:</label><br>
                <input type="text" id="nome" name="nome" required><br>

                <label for="email">E-mail:</label><br>
                <input type="email" id="email" name="email" required><br>

                <label for="telefone">Telefone:</label><br>
                <input type="tel" id="telefone" name="telefone" required><br>
            </fieldset>

            <fieldset>
                <legend>Endereço:</legend>
                <label for="cep">CEP:</label><br>
                <input type="text" id="cep" name="cep" placeholder="00000-000" maxlength="9"><br>

                <label for="logradouro">Logradouro:</label><br>
                <input type="text" id="logradouro" name="logradouro" placeholder="Sua Rua"><br>

                <label for="numero">Número:</label><br>
                <input type="text" id="numero" name="numero" placeholder="Ex: 123"><br>

                <label for="complemento">Complemento:</label><br>
                <input type="text" id="complemento" name="complemento" placeholder="Ex: Apt 123"><br>

                <label for="bairro">Bairro:</label><br>
                <input type="text" id="bairro" name="bairro" placeholder="Seu Bairro"><br>

                <label for="cidade">Cidade:</label><br>
                <input type="text" id="cidade" name="cidade" placeholder="Sua Cidade"><br>

                <label for="estado">Estado:</label><br>
                <input type="text" id="estado" name="estado" placeholder="Seu Estado" required><br>

                <button type="submit" id="cadastrar">Cadastrar</button>
            </fieldset>
        </form>

    </div>
    <script src="script.js"></script>

</body>

</html>
